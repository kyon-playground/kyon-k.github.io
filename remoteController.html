<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>リモコン</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rossorigin="anonymous">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.min.css">
	<link rel="stylesheet" href="./remoteController.css?aaaaaaaa">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="./popper.min.js?aaaaaa"></script>
	<script src="./remoteController.js?aaaaaaaaa"></script>
	<style>
	</style>
</head>
<body>
<header>
	<a href="./index.html" class="back_btn btn btn-info">戻る</a>
</header>
<main>
	<div id="container">
		<div id="1F">
			<p class="room_title">1F</p>
			<div class="room_wrapper">
				<div class="room room2"><p>風呂場</p></div>
				<div class="room room3">
					<p>リビング</p>
					<ul>
						<li><a class="btn btn-secondary" id="1FLivingRoomDyson" href="javascript:void(0);">Dyson</a></li>
					</ul>
				</div>
				<div class="room room2"><p>玄関</p></div>
				<div class="room room2"><p>階段</p></div>
				<div class="room room2"><p>トイレ</p></div>
				<div class="room room2"><p>居間</p></div>
			</div>
		</div>
		<div id="2F">
			<p class="room_title">2F</p>
			<div class="room_wrapper">
				<div class="room room2"><p>仕事部屋</p></div>
				<div class="room room1">
					<p>寝室</p>
					<ul>
						<li><a class="btn btn-primary" id="2FBedRoomDyson" href="javascript:void(0);">Dyson</a></li>
						<li><a class="btn btn-primary" id="2FBedRoomAirConditioner" href="javascript:void(0);">エアコン</a></li>
					</ul>
				</div>
				<div class="room room2"><p>ベランダ</p></div>
				<div class="room room2"><p>ストレージルーム</p></div>
				<div class="room room2"><p>トイレ</p></div>
				<div class="room room2"><p>廊下、階段</p></div>
				<div class="room room2"><p>居間（ゆか）</p></div>
			</div>
		</div>
	</div>
	<div id="1FLivingRoomDysonPopup" class="popup">
		<div class="content">
			<ul>
				<li>
					<a class="btn btn-primary confirm" href="javascript:void(0);" onclick="confirm('1F リビングのDyson', 'power_on_off');">電源入り切り</a>
				</li>
			</ul>
			<p><a id="1FLivingRoomDysonClose" class="close btn btn-secondary" href="javascript: void(0);">閉じる</a></p>
		</div>
	</div>
	<div id="2FBedRoomDysonPopup" class="popup">
		<div class="content">
			<ul>
				<li>
					<a class="btn btn-primary confirm" href="javascript:void(0);" onclick="confirm('2F 寝室のDyson', 'power_on_off', 'の電源入りまたは切りを実施します。');">電源入り切り</a>
				</li>
			</ul>
			<p><a id="2FBedRoomDysonClose" class="close btn btn-secondary" href="javascript: void(0);">閉じる</a></p>
		</div>
	</div>
	<div id="2FBedRoomAirConditionerPopup" class="popup">
		<div class="content">
			<ul>
				<li>
					<a class="btn btn-primary confirm" href="javascript:void(0);" onclick="confirm('2F 寝室のエアコン', 'power_on_dry', 'を除湿27℃で起動します。');">除湿(27℃)</a>
				</li>
				<li>
					<a class="btn btn-primary confirm" href="javascript:void(0);" onclick="confirm('2F 寝室のエアコン', 'power_off', 'の電源OFFします。');">電源OFF</a>
				</li>
				<li>
					<a data="2F 寝室のエアコン" class="airConCustomize btn btn-primary" href="javascript:void(0);">カスタム</a>
				</li>
			</ul>
			<p><a id="2FBedRoomAirConditionerClose" class="close btn btn-secondary" href="javascript: void(0);">閉じる</a></p>
		</div>
	</div>
	<div id="airConditionerCustomizePopup" class="popup">
		<div class="content">
			<div id="temperatureCustom" class="customize_area">
				<a href="javascript:void(0);" onclick="temperature_down();">&lt;</a>
				<span id="temperature">27</span>
				<a href="javascript:void(0);" onclick="temperature_up();">&gt;</a>
				<input type="hidden" id="temperatureValue" value="27">
			</div>
			<div id="mode" class="customize_area">
				<p>運転モード</p>
				<input type="radio" name="mode" id="airConModeAuto" value="1"><label for="airConModeAuto">オート</label>
				<input type="radio" name="mode" id="airConModeCool" value="2"><label for="airConModeCool">冷房</label>
				<input type="radio" name="mode" id="airConModeDry" value="3"><label for="airConModeDry">除湿</label>
				<input type="radio" name="mode" id="airConModeHeat" value="5"><label for="airConModeHeat">暖房</label>
			</div>
			<div id="fanSpeed" class="customize_area">
				<p>送風強さ</p>
				<input type="radio" name="fan_speed" id="airConFanspeedAuto" value="1"><label for="airConFanspeedAuto">オート</label>
				<input type="radio" name="fan_speed" id="airConFanspeedLow" value="2"><label for="airConFanspeedLow">弱</label>
				<input type="radio" name="fan_speed" id="airConFanspeedMedium" value="3"><label for="airConFanspeedMedium">中</label>
				<input type="radio" name="fan_speed" id="airConFanspeedHigh" value="5"><label for="airConFanspeedHigh">強</label>
			</div>
			<p><a id="airConditionerCustomizeSend" class="close btn btn-primary" href="javascript: void(0);">設定</a></p>
			<p><a id="airConditionerCustomizePopupClose" class="close btn btn-secondary" href="javascript: void(0);">閉じる</a></p>
		</div>
	</div>
	<div id="confirm" class="popup">
		<div class="content">
			<p id="message">{deviceName}<br>よろしいですか？</p>
			<div class="confirm_btn">
				<p><a id="no" class="close" href="javascript: void(0);" onclick="(no())">いいえ</a></p>
				<p><a id="yes" class="close" href="javascript: void(0);" onclick="(yes())">はい</a></p>
			</div>
		</div>
	</div>
</main>
<footer>
	<a href="./index.html" class="back_btn btn btn-info">戻る</a>
</footer>
</body>
</html>
